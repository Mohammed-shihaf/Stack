[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardgame"
version = "1.0.0"
description = "card game scoring with genuinely orphaned pyan3 call-graph nodes"
requires-python = "==3.11.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
