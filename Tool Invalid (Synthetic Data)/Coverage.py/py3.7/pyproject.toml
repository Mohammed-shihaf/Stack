[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discountly"
version = "1.0.0"
description = "progressive quantity discounts, shipping and coupons"
requires-python = "==3.7.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Makes the src layout importable without installing and without a conftest
# shim in every folder.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
