[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerbook"
version = "1.0.0"
description = "categorised expense ledger"
requires-python = "==3.6.*"
dependencies = [
  "requests==2.19.1",
  "PyYAML==5.3",
  "Jinja2==2.10",
  "cryptography==2.3",
  "click==8.1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
