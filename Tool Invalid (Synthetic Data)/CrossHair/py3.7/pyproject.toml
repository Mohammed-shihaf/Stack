[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelmath"
version = "1.0.0"
description = "closed integer ranges for parcel routing with genuinely violable contracts"
requires-python = "==3.7.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
