[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cargoroute"
version = "1.0.0"
description = "shipping route distance and cost estimation"
requires-python = "==3.13.*"
dependencies = [
  "Flask==0.12",
  "Werkzeug==0.15.3",
  "urllib3==1.24.1",
  "itsdangerous==0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
