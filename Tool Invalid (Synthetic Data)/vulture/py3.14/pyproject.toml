[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconreg"
version = "1.0.0"
description = "a lighthouse beacon registry, mostly unwired"
requires-python = "==3.14.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
