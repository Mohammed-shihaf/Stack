[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleflex"
version = "1.0.0"
description = "dynamically-loaded pricing rules (legacy exec, shared import-time constant, lazily-imported plugin)"
requires-python = "==3.13.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
