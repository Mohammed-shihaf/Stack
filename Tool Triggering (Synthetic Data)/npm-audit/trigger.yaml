tool: npm-audit
label: "npm audit / npm ls"
language: typescript
node_version: "14"
typescript_version: "5.1.6"
branch: "TS-027"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "yarn (Berry)"
bundler: "esbuild"
project: package.json
tests: tests/
tools_project: tools/
pinned-version: null  # not an npm package -- see the runner
config: null
target_files: [package.json]
command: "yarn npm audit --json --recursive || true"
expects_findings: true
