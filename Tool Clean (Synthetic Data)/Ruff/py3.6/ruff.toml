# Explicit rule selection: a default-only pass proves almost nothing.
line-length = 88
target-version = "py37"  # Ruff's lowest target; this is the py3.6 variant

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D213"]

[lint.pydocstyle]
convention = "pep257"
